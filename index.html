<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stony Automation — Tableau de bord</title>
  <meta name="theme-color" content="#1F2933">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='45' width='50' height='14' rx='7' fill='%2352606D'/%3E%3Crect x='13' y='31.5' width='38' height='13' rx='6.5' fill='%237B8794' transform='rotate(-4 32 38)'/%3E%3Crect x='19' y='19' width='26' height='12' rx='6' fill='%239AA5B1' transform='rotate(3 32 25)'/%3E%3Crect x='27' y='6.5' width='14' height='11' rx='5.5' fill='%233F8F6E' transform='rotate(-6 34 12)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span id="brand-name">Stony Automation</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="sync-status" class="sync"></div>
        <div id="timer-mini" class="timer-mini hidden"></div>
        <button class="btn ghost" id="open-settings">⚙ Paramètres et sauvegarde</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="view-title">Tableau de bord</h1>
        <div id="view-actions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- Écran de connexion -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark">◆</span> <span id="auth-brand">Stony Automation</span></div>

      <form id="login-form">
        <h1>Connexion</h1>
        <label>Courriel<input name="email" type="email" autocomplete="username" required></label>
        <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary wide">Se connecter</button>
        <button type="button" class="linkbtn" id="show-reset">Mot de passe oublié ?</button>
      </form>

      <form id="reset-form" class="hidden">
        <h1>Mot de passe oublié</h1>
        <p class="muted">Entre ton courriel. Tu recevras un lien pour choisir un nouveau mot de passe.</p>
        <label>Courriel<input name="email" type="email" autocomplete="username" required></label>
        <button class="btn primary wide">Envoyer le lien</button>
        <button type="button" class="linkbtn" id="back-login">← Retour à la connexion</button>
      </form>

      <form id="newpass-form" class="hidden">
        <h1>Nouveau mot de passe</h1>
        <label>Nouveau mot de passe (8 caractères minimum)<input name="p1" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirmer<input name="p2" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn primary wide">Enregistrer le mot de passe</button>
      </form>

      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="agents.js"></script>
  <script src="reunions.js"></script>
  <script src="brand.js"></script>
</body>
</html>
