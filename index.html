<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stony Automation — Tableau de bord</title>
  <meta name="theme-color" content="#1F2933">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='4 4 56 58'%3E%3Cpolygon points='18,18 34,8 30,28' fill='#CBD2D9'/%3E%3Cpolygon points='34,8 52,16 42,36 30,28' fill='#9AA5B1'/%3E%3Cpolygon points='52,16 56,38 42,36' fill='#7B8794'/%3E%3Cpolygon points='56,38 44,56 42,36' fill='#52606D'/%3E%3Cpolygon points='44,56 22,58 26,44 42,36' fill='#3E4C59'/%3E%3Cpolygon points='22,58 10,40 26,44' fill='#52606D'/%3E%3Cpolygon points='10,40 18,18 30,28 26,44' fill='#7B8794'/%3E%3Cpolygon points='30,28 42,36 26,44' fill='#3F8F6E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Applique le thème tout de suite (évite un flash blanc en mode nuit)
    (function () {
      var t = 'auto'; try { t = localStorage.getItem('stony-theme') || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span id="brand-name">Stony Automation</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Thème">
          <button type="button" data-theme-set="light" title="Mode jour">☀️ Jour</button>
          <button type="button" data-theme-set="dark" title="Mode nuit">🌙 Nuit</button>
          <button type="button" data-theme-set="auto" title="Suivre l’appareil">🖥 Auto</button>
        </div>
        <div id="sync-status" class="sync"></div>
        <div id="timer-mini" class="timer-mini hidden"></div>
        <button class="btn ghost" id="open-settings">⚙ Paramètres et sauvegarde</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="view-title">Tableau de bord</h1>
        <div id="view-actions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- Écran de connexion -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark">◆</span> <span id="auth-brand">Stony Automation</span></div>

      <form id="login-form">
        <h1>Connexion</h1>
        <label>Courriel<input name="email" type="email" autocomplete="username" required></label>
        <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary wide">Se connecter</button>
        <button type="button" class="linkbtn" id="show-reset">Mot de passe oublié ?</button>
      </form>

      <form id="reset-form" class="hidden">
        <h1>Mot de passe oublié</h1>
        <p class="muted">Entre ton courriel. Tu recevras un lien pour choisir un nouveau mot de passe.</p>
        <label>Courriel<input name="email" type="email" autocomplete="username" required></label>
        <button class="btn primary wide">Envoyer le lien</button>
        <button type="button" class="linkbtn" id="back-login">← Retour à la connexion</button>
      </form>

      <form id="newpass-form" class="hidden">
        <h1>Nouveau mot de passe</h1>
        <label>Nouveau mot de passe (8 caractères minimum)<input name="p1" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirmer<input name="p2" type="password" minlength="8" autocomplete="new-password" required></label>
        <button class="btn primary wide">Enregistrer le mot de passe</button>
      </form>

      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="agents.js"></script>
  <script src="reunions.js"></script>
  <script src="documents.js"></script>
  <script src="croissance.js"></script>
  <script src="brand.js"></script>
  <script src="theme.js"></script>
</body>
</html>
